[package]
name = "veylog"
version = "0.3.0"
edition = "2024"
# En düşük Rust sürümü: `if let ... && ...` zincirleri 1.88'de kararlı hale geldi
rust-version = "1.88"
description = "Summarizes Laravel log files into recurring error patterns, with exception fingerprints, deploy comparisons, spike detection and live watching"
authors = ["Veysel Tulu"]
license = "MIT"
repository = "https://github.com/Veysel440/veylog"
readme = "README.md"
keywords = ["laravel", "log", "log-analysis", "monolog", "php"]
categories = ["command-line-utilities", "development-tools::debugging"]
# crates.io'ya yüklenecek dosyalar; CI ayarları ve depo dosyaları pakete girmez
include = ["src/", "tests/", "benches/", "examples/", "ornekler/", "docs/", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
regex = "1.13.1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
serde_json = "1.0.154"

[[bench]]
name = "drain"
harness = false

[[bench]]
name = "end_to_end"
harness = false

# Dağıtılan program küçük ve hızlı olsun: bütün program birlikte iyileştirilir (LTO), hata
# ayıklama sembolleri atılır
[profile.release]
lto = true
codegen-units = 1
strip = true
